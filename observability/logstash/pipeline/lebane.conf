# Pipeline "lebane": recibe eventos JSON (uno por línea) del LogstashTcpSocketAppender del backend
# y los indexa en Elasticsearch. Credenciales por variable de entorno (ELASTIC_PASSWORD).
input {
  tcp {
    id => "lebane-tcp-input"
    port => 5000
    codec => json_lines
  }
}

filter {
  # Defensa en profundidad: elimina campos sensibles si llegaran por error.
  mutate {
    remove_field => [ "password", "secret", "secretKey", "accessKey", "token", "apiKey", "authorization", "cookie" ]
  }
}

output {
  elasticsearch {
    id => "lebane-es-output"
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "lebane-logs-%{+YYYY.MM.dd}"
    data_stream => false
  }
}
