# Perfil de test sin base de datos disponible (no requiere Docker).
# Simula PostgreSQL caído: la app debe iniciar, liveness UP y readiness DOWN (503).
spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:postgresql://127.0.0.1:1/lebane
    username: lebane
    password: not-a-real-password
    hikari:
      connection-timeout: 500
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        boot:
          allow_jdbc_metadata_access: false

lebane:
  security:
    actuator:
      username: probe
      password: probe-secret
