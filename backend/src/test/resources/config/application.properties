# Solo en tests: classpath:/config/application.properties se suma a application.yml (no lo reemplaza).
# Los tests que no prueban storage no deben intentar crear el bucket contra un MinIO que no existe (o contra el de
# desarrollo, con credenciales de test). Los que lo prueban (StorageIT) lo habilitan explícitamente.
lebane.storage.create-bucket=false
# Endpoint inalcanzable: las subidas fallan rápido (conexión rechazada) en vez de llegar a un MinIO real.
lebane.storage.endpoint=http://127.0.0.1:1
