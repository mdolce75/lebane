# Toda la configuración sensible o dependiente del ambiente proviene de variables de entorno.
# Los valores por defecto solo sirven para desarrollo local y no contienen secretos reales.

spring:
  application:
    name: ${LOG_SERVICE_NAME:lebane-backend}
  main:
    # El banner no es JSON: se desactiva para no romper la ingesta de logs.
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lebane}
    username: ${DB_USERNAME:lebane}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: lebane-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Timeout corto: el health de readiness no debe colgarse si PostgreSQL no responde.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
  flyway:
    # Migraciones versionadas en db/migration. Se aplican al arrancar, antes de que Hibernate valide el esquema.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestiona Flyway. Hibernate solo valida que las entidades coincidan con las tablas.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  web:
    # Mensajes de Bean Validation en español, independientes del Accept-Language y del locale del contenedor.
    locale: es
    locale-resolver: fixed
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      # El alta admite hasta 5 fotos en el mismo request (5 × 5 MB + los datos); la subida suelta, una.
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:26MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Nunca exponer detalles internos en respuestas de error.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

lebane:
  security:
    actuator:
      username: ${ACTUATOR_USERNAME:actuator}
      # Sin default: si no se define, se genera uno aleatorio en el arranque (ver ActuatorSecurityProperties).
      password: ${ACTUATOR_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    # Endpoint interno (backend -> MinIO) y URL pública (navegador -> MinIO; bucket con lectura pública).
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    public-url: ${STORAGE_PUBLIC_URL:http://localhost:9000}
    # Sin defaults: credenciales solo por variables de entorno.
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:lebane-images}
    region: ${STORAGE_REGION:us-east-1}
    create-bucket: ${STORAGE_CREATE_BUCKET:true}
    # Mismo límite que el multipart (UPLOAD_MAX_FILE_SIZE).
    max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
    connect-timeout: ${STORAGE_CONNECT_TIMEOUT:2s}
  address:
    provider: ${ADDRESS_PROVIDER:stub}
    url: ${ADDRESS_PROVIDER_URL:https://apis.datos.gob.ar/georef/api}
    api-key: ${ADDRESS_PROVIDER_API_KEY:}
    timeout: ${ADDRESS_PROVIDER_TIMEOUT_MS:2000}ms
    max-results: ${ADDRESS_PROVIDER_MAX_RESULTS:5}
  seed:
    # Datos de ejemplo idempotentes. Deshabilitado por defecto; .env.example lo habilita para desarrollo local.
    enabled: ${SEED_ENABLED:false}
  logging:
    # Leídos por logback-spring.xml mediante <springProperty>.
    format: ${LOG_FORMAT:json}
    service-name: ${LOG_SERVICE_NAME:lebane-backend}
    environment: ${LOG_ENVIRONMENT:local}
    logstash:
      enabled: ${LOGSTASH_ENABLED:false}
      host: ${LOGSTASH_HOST:logstash}
      port: ${LOGSTASH_PORT:5000}

# Resiliencia de integraciones externas. Cada instancia combina Retry ( CircuitBreaker ( TimeLimiter ( llamada ) ) )
# (ver ResilientExecutor). Solo los fallos transitorios (red, 5xx, timeouts) se reintentan y abren el circuito.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${R4J_CB_WINDOW_SIZE:20}
        minimum-number-of-calls: ${R4J_CB_MIN_CALLS:5}
        failure-rate-threshold: ${R4J_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${R4J_CB_WAIT_OPEN:30s}
        permitted-number-of-calls-in-half-open-state: ${R4J_CB_HALF_OPEN_CALLS:2}
        automatic-transition-from-open-to-half-open-enabled: false
        record-exception-predicate: com.lebane.resilience.TransientFailurePredicate
        # Los health indicators de los circuitos no se registran: una dependencia opcional caída no debe volver
        # DOWN el health ni el readiness.
        register-health-indicator: false
    instances:
      storage:
        base-config: default
      address:
        base-config: default
  retry:
    configs:
      default:
        max-attempts: ${R4J_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${R4J_RETRY_WAIT:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exception-predicate: com.lebane.resilience.TransientFailurePredicate
    instances:
      storage:
        base-config: default
      address:
        base-config: default
        # Autocompletado interactivo: un solo reintento para no hacer esperar al usuario.
        max-attempts: ${ADDRESS_RETRY_MAX_ATTEMPTS:2}
  timelimiter:
    configs:
      default:
        cancel-running-future: true
        timeout-duration: 5s
    instances:
      storage:
        base-config: default
        timeout-duration: ${STORAGE_TIMEOUT:10s}
      address:
        base-config: default
        timeout-duration: ${ADDRESS_PROVIDER_TIMEOUT_MS:2000}ms

# Documentación OpenAPI (springdoc). OPENAPI_ENABLED=false la apaga por completo (spec y Swagger UI responden 404).
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  # Solo la API de dominio: Actuator tiene su propia documentación y no forma parte del contrato público.
  paths-to-match: /api/**
  # Las respuestas de error se documentan por operación (las que cada endpoint puede devolver de verdad), no la
  # lista genérica de todos los @ExceptionHandler del GlobalExceptionHandler.
  override-with-generic-response: false
  # Salida determinística: el spec versionado en docs/openapi.json se compara en los tests.
  writer-with-order-by-keys: true
  default-produces-media-type: application/json

management:
  # Por defecto Actuator comparte el puerto de la app. Para aislarlo en red interna definir
  # MANAGEMENT_SERVER_PORT (binding relajado de Spring) y no publicarlo fuera de Docker.
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # No se agregan health indicators para Logstash/Elasticsearch: no son dependencias críticas.
    elasticsearch:
      enabled: false
  info:
    env:
      enabled: false
    build:
      enabled: true
    # /actuator/info es público: la versión exacta de la JVM ayudaría a buscar vulnerabilidades conocidas.
    java:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${LOG_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.lebane: ${LOG_LEVEL_APP:INFO}
    # Evita ruido y posibles parámetros SQL en logs.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    # Cada excepción se registra una sola vez, en GlobalExceptionHandler. SqlExceptionHelper la repetía (WARN + ERROR
    # por request) con el mensaje de PostgreSQL, que en una violación de unicidad incluye los valores de la fila.
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    # Con la base caída, cada probe de readiness registraba un WARN con stack trace completo (~5 KB cada 10-30 s).
    # La caída sigue visible: readiness 503, WARN "Database unavailable" por request, avisos de Hikari y métricas.
    org.springframework.boot.actuate.jdbc.DataSourceHealthIndicator: ERROR
