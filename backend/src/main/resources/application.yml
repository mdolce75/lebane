# Toda la configuración sensible o dependiente del ambiente proviene de variables de entorno.
# Los valores por defecto solo sirven para desarrollo local y no contienen secretos reales.

spring:
  application:
    name: ${LOG_SERVICE_NAME:lebane-backend}
  main:
    # El banner no es JSON: se desactiva para no romper la ingesta de logs.
    banner-mode: off
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lebane}
    username: ${DB_USERNAME:lebane}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: lebane-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # Timeout corto: el health de readiness no debe colgarse si PostgreSQL no responde.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gestionan migraciones versionadas (Fase 2). Hibernate solo valida.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        query:
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:5MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:30MB}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    # Nunca exponer detalles internos en respuestas de error.
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false
  tomcat:
    mbeanregistry:
      enabled: true

lebane:
  security:
    actuator:
      username: ${ACTUATOR_USERNAME:actuator}
      # Sin default: si no se define, se genera uno aleatorio en el arranque (ver ActuatorSecurityProperties).
      password: ${ACTUATOR_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  logging:
    # Leídos por logback-spring.xml mediante <springProperty>.
    format: ${LOG_FORMAT:json}
    service-name: ${LOG_SERVICE_NAME:lebane-backend}
    environment: ${LOG_ENVIRONMENT:local}
    logstash:
      enabled: ${LOGSTASH_ENABLED:false}
      host: ${LOGSTASH_HOST:logstash}
      port: ${LOGSTASH_PORT:5000}

management:
  # Por defecto Actuator comparte el puerto de la app. Para aislarlo en red interna definir
  # MANAGEMENT_SERVER_PORT (binding relajado de Spring) y no publicarlo fuera de Docker.
  endpoints:
    access:
      default: none
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        liveness:
          include:
            - livenessState
        readiness:
          include:
            - readinessState
            - db
    info:
      access: read-only
    metrics:
      access: read-only
    prometheus:
      access: read-only
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # No se agregan health indicators para Logstash/Elasticsearch: no son dependencias críticas.
    elasticsearch:
      enabled: false
  info:
    env:
      enabled: false
    build:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${LOG_ENVIRONMENT:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: w3c
  observations:
    key-values:
      application: ${spring.application.name}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.lebane: ${LOG_LEVEL_APP:INFO}
    # Evita ruido y posibles parámetros SQL en logs.
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
