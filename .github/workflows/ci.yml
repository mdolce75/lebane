# CI de Lebane: backend (unitarios + integración con Testcontainers + contrato OpenAPI), frontend (lint, tipos,
# tests, build, auditoría) y E2E con Playwright contra el stack completo levantado con Docker Compose.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Solo lectura: el pipeline no publica nada ni escribe en el repositorio.
permissions:
  contents: read

# Un push nuevo a la misma rama/PR cancela la corrida anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unitarios (*Test, incluye OpenApiSpecTest) + integración (*IT, PostgreSQL y MinIO reales con Testcontainers;
      # Docker ya está disponible en el runner) + reporte de cobertura de JaCoCo.
      - name: Build y tests
        run: ./mvnw -B -ntp verify

      - name: Resumen de cobertura
        if: always()
        run: |
          csv=target/site/jacoco/jacoco.csv
          [ -f "$csv" ] || exit 0
          awk -F, 'NR > 1 { lm += $8; lc += $9; bm += $6; bc += $7 }
            END { printf "### Cobertura backend\n\n| Líneas | Ramas |\n|---|---|\n| %.1f %% | %.1f %% |\n",
                  100 * lc / (lc + lm), 100 * bc / (bc + bm) }' "$csv" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-cobertura
          path: backend/target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar reportes de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reportes-tests
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Tests con cobertura
        run: npm run test:coverage -- --coverage.reporter=text-summary --coverage.reporter=html

      - name: Build
        run: npm run build

      # Solo dependencias que llegan al bundle; falla con vulnerabilidades altas o críticas.
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-cobertura
          path: frontend/coverage
          if-no-files-found: ignore
          retention-days: 14

  e2e:
    name: E2E (stack completo)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # Nunca credenciales fijas, ni siquiera en CI: cada placeholder change-me se reemplaza por un valor aleatorio.
      # Los que comparten placeholder (p. ej. MINIO_ROOT_USER y STORAGE_ACCESS_KEY) reciben el mismo valor.
      - name: Generar .env con secretos aleatorios
        run: |
          cp .env.example .env
          grep -oE '=change-me[^[:space:]]*' .env | cut -c2- | sort -u | while read -r placeholder; do
            valor="ci$(openssl rand -hex 20)"
            echo "::add-mask::$valor"
            sed -i "s|=${placeholder}\$|=${valor}|" .env
          done
          ! grep -q '=change-me' .env

      - name: Levantar el stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias y Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # En CI se usa el Chromium de Playwright (localmente, el Chrome instalado).
      - name: E2E con Playwright
        working-directory: frontend
        env:
          E2E_BROWSER_CHANNEL: chromium
        run: npm run e2e

      - name: Logs del stack
        if: failure()
        run: docker compose logs --no-color > stack.log 2>&1 || true

      - name: Publicar reportes de E2E
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-reportes
          path: |
            frontend/playwright-report
            frontend/test-results
            stack.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Bajar el stack
        if: always()
        run: docker compose down -v
